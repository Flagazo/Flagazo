# Configuración de despliegue para Render (https://render.com).
#
# Con este archivo en el repo, Render ofrece crear el servicio ya configurado
# ("Blueprint") en vez de pedir que se completen los campos a mano. Si se
# despliega en otra plataforma, este archivo se ignora solo.
#
# Flagazo es un solo proceso Node en un solo puerto: el mismo servidor sirve el
# cliente compilado, las banderas y el WebSocket. Las parties viven en memoria;
# solo las cuentas de usuario van a Postgres (fuera de Render, ver DATABASE_URL).

services:
  - type: web
    name: flagazo
    runtime: node
    plan: free
    # Ohio es la región de Render con menos latencia desde Sudamérica.
    region: ohio
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"

      # El link de donaciones. `sync: false` significa que el valor NO vive en
      # el repo: Render lo pide al crear el servicio y lo guarda de su lado.
      #
      # Tiene que estar cargado ANTES del primer build. Vite lo mete dentro del
      # archivo compilado, así que agregarlo después no alcanza: hay que volver
      # a desplegar para que entre. Sin esta variable el botón no se dibuja.
      - key: VITE_DONATE_URL
        sync: false

      # Publicidad. Vacías hasta tener una cuenta aprobada; sin la primera, no
      # se carga ningún script de terceros y los espacios no se dibujan.
      - key: VITE_ADS_CLIENT
        sync: false
      - key: VITE_ADS_SLOT_LOBBY
        sync: false
      - key: VITE_ADS_SLOT_RESULTS
        sync: false

      # Postgres de las cuentas (Neon). Es un secreto: lleva usuario y contraseña.
      # Sin esta variable el juego funciona igual, con las cuentas apagadas. Las
      # migraciones se aplican solas al arrancar. Se usa en runtime, no en el
      # build: cargarla o cambiarla alcanza con reiniciar, no hace falta redeploy.
      - key: DATABASE_URL
        sync: false

      # Secreto para firmar los códigos que llegan por email (32+ caracteres
      # aleatorios). Render lo genera solo al crear el servicio desde este archivo;
      # en un servicio ya creado hay que cargarlo a mano.
      - key: AUTH_SECRET
        generateValue: true

      # Clave de la API de Resend (emails de verificación y de recuperar la
      # contraseña). Sin ella las cuentas quedan apagadas: sin email nadie podría
      # verificar la suya. Es por API y no por SMTP porque el plan gratis de Render
      # bloquea los puertos de SMTP.
      - key: RESEND_API_KEY
        sync: false

      # Dirección pública, sin barra final. Con ella se arma la URL a la que vuelven
      # Google y Discord, que tiene que coincidir con la registrada en cada uno.
      - key: PUBLIC_URL
        value: https://flagazo.com

      # Huso horario del ranking mensual (en qué mes cae cada partida). Vacío = UTC.
      - key: LEADERBOARD_TIMEZONE
        sync: false

      # "Continuar con Google" y "Continuar con Discord". Cada botón aparece solo
      # si están su id y su secreto.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

# Sin autoescalado a propósito: las partidas viven en memoria del proceso. Con
# dos instancias, dos jugadores pueden caer en procesos distintos y no verse.
# Para escalar haría falta mover el estado a Redis.
