<!--
  Ícono de la pestaña.

  Cuadro con degradé rosa → naranja y la bandera en blanco. El cuadro va lleno de
  color a propósito: entre veinte pestañas, un ícono oscuro sobre el fondo oscuro
  del navegador no se encuentra, y este sí.

  Tiene que leerse a 16px, así que son pocas partes y gruesas: mástil ancho, una
  sola tela y una sola onda.

  El logo de `client/src/components/Logo.tsx` usa el mismo degradé, pero sobre la
  tela: ahí la bandera va suelta sobre el fondo y no tiene cuadro donde ponerlo.
  Si cambian los colores, cambiar los dos.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="11" y="8" width="8" height="48" rx="4" fill="#fff"/>
  <path d="M19 12c8-5 15 5 23 0 3-2 6-1.5 8 0v26c-2-1.5-5-2-8 0-8 5-15-5-23 0z" fill="#fff" opacity=".92"/>
</svg>
